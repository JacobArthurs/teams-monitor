[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teams-monitor"
dynamic = ["version"]
description = "Tails Microsoft Teams logs on Windows and sends webhook alerts for calls, messages and outages."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Monitoring",
]

[project.scripts]
teams-monitor = "teams_monitor.cli:main"

[tool.setuptools.dynamic]
version = { attr = "teams_monitor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
