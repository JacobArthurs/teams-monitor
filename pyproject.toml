[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "teams-monitor"
dynamic = ["version"]
description = "Tails Microsoft Teams logs on Windows and sends webhook alerts for calls, new activity and outages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Arthurs" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/JacobArthurs/teams-monitor"
Issues = "https://github.com/JacobArthurs/teams-monitor/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
teams-monitor = "teams_monitor.cli:main"

[tool.setuptools.dynamic]
version = { attr = "teams_monitor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",  # allow assert in tests
    "S105",  # fake secrets are used to check that real ones are never leaked
]
